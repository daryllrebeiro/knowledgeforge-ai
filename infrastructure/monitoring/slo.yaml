# SUPERSEDED — monitoring is defined as code in infrastructure/terraform/main.tf
# (google_monitoring_slo.ask_availability, google_monitoring_alert_policy.*).
#
# This file is retained only as a reference for gcloud-based SLO management in
# environments not managed by Terraform. Do not apply it alongside Terraform:
# the two would fight over the same policies, and this manifest's filters are
# less specific (no environment-suffixed service name, no dead-letter
# subscription_id filter in the alert).
#
# To manage SLOs manually with gcloud instead, first delete the corresponding
# resources from main.tf, then correct before applying:
#   spec.service: knowledgeforge-api-<environment>
#   AlertPolicy conditionThreshold.filter: add
#     resource.type="pubsub_subscription" AND
#     resource.labels.subscription_id="knowledgeforge-ingestion-dead-letter-sub-<environment>"
---
apiVersion: monitoring.googleapis.com/v1
kind: ServiceLevelObjective
metadata:
  name: knowledgeforge-ask-availability
spec:
  service: knowledgeforge-api
  displayName: Ask availability
  goal: 0.99
  rollingPeriod: 30d
  requestBased:
    goodTotalRatio:
      totalServiceFilter: 'resource.type="cloud_run_revision" AND metric.type="run.googleapis.com/request_count" AND resource.labels.service_name="knowledgeforge-api" AND metric.labels.response_code_class!="4xx"'
      goodServiceFilter: 'metric.labels.response_code_class="2xx"'
---
apiVersion: monitoring.googleapis.com/v1
kind: AlertPolicy
metadata:
  name: knowledgeforge-dead-letter-nonempty
spec:
  displayName: KnowledgeForge dead-letter queue non-empty
  combiner: OR
  conditions:
    - displayName: Dead-letter messages exist
      conditionThreshold:
        filter: 'metric.type="pubsub.googleapis.com/subscription/num_undelivered_messages"'
        comparison: COMPARISON_GT
        thresholdValue: 0
        duration: 300s
