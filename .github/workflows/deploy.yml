name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [staging, production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push API image
        run: |
          gcloud builds submit --tag "${{ vars.ARTIFACT_REGISTRY }}/knowledgeforge-api:${{ github.sha }}" .
          gcloud builds submit --tag "${{ vars.ARTIFACT_REGISTRY }}/knowledgeforge-worker:${{ github.sha }}" -f infrastructure/Dockerfile.worker .
      - name: Terraform apply
        working-directory: infrastructure/terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_api_image: ${{ vars.ARTIFACT_REGISTRY }}/knowledgeforge-api:${{ github.sha }}
          TF_VAR_worker_image: ${{ vars.ARTIFACT_REGISTRY }}/knowledgeforge-worker:${{ github.sha }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          terraform init
          terraform apply -auto-approve
