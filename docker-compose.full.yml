services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: knowledgeforge
      POSTGRES_USER: knowledgeforge
      POSTGRES_PASSWORD: knowledgeforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgeforge -d knowledgeforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # R5.8: mutable `:latest` is a supply-chain risk. Pin to an immutable
  # digest once one is resolved (needs network access):
  #   docker buildx imagetools inspect fsouza/fake-gcs-server:latest
  #   -> replace the tag below with fsouza/fake-gcs-server@sha256:<digest>
  # Tracked in the verification checklist (docs/validation-status.md).
  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    command: ["-scheme", "http", "-port", "4443", "-external-url", "http://fake-gcs:4443"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4443/storage/v1/b"]
      interval: 5s
      timeout: 3s
      retries: 20

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >-
      gcloud beta emulators pubsub start
      --project=local-project --host-port=0.0.0.0:8085
    environment:
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"

  local-cloud-init:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    depends_on:
      fake-gcs:
        condition: service_healthy
      pubsub-emulator:
        condition: service_started
    environment:
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
    volumes:
      - ./scripts/init_local_cloud.sh:/init_local_cloud.sh:ro
    entrypoint: ["bash", "/init_local_cloud.sh"]

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://knowledgeforge:knowledgeforge@postgres:5432/knowledgeforge
    command: ["python", "scripts/apply_migrations.py"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrations:
        condition: service_completed_successfully
      local-cloud-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://knowledgeforge:knowledgeforge@postgres:5432/knowledgeforge
      REDIS_URL: redis://redis:6379/0
      GCP_PROJECT_ID: local-project
      GCS_BUCKET: knowledgeforge
      PUBSUB_TOPIC: knowledgeforge-ingestion
      PUBSUB_SUBSCRIPTION: knowledgeforge-ingestion-worker
      ASYNC_INGESTION: "true"
      LOCAL_EMBEDDINGS: "true"
      LOCAL_GENERATION: "true"
      LOCAL_EXTRACTION: "true"
      STORAGE_EMULATOR_HOST: http://fake-gcs:4443
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GEMINI_API_KEY: local-emulator-not-used
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.worker
    depends_on:
      migrations:
        condition: service_completed_successfully
      local-cloud-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://knowledgeforge:knowledgeforge@postgres:5432/knowledgeforge
      GCP_PROJECT_ID: local-project
      GCS_BUCKET: knowledgeforge
      PUBSUB_SUBSCRIPTION: knowledgeforge-ingestion-worker
      LOCAL_EMBEDDINGS: "true"
      LOCAL_EXTRACTION: "true"
      EXTRACTION_TOPIC: knowledgeforge-extraction
      STORAGE_EMULATOR_HOST: http://fake-gcs:4443
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GEMINI_API_KEY: local-emulator-not-used
    command: ["python", "-m", "knowledgeforge.worker.pull_entrypoint"]
    # Pull workers serve no HTTP; the image HEALTHCHECK targets the push
    # entrypoint's port and would report a false "unhealthy".
    healthcheck:
      disable: true

  # Phase 2.5: extraction worker (separate blast radius from ingestion) and
  # the outbox dispatcher that publishes document.ready events.
  extraction-worker:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.worker
    depends_on:
      migrations:
        condition: service_completed_successfully
      local-cloud-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://knowledgeforge:knowledgeforge@postgres:5432/knowledgeforge
      GCP_PROJECT_ID: local-project
      GCS_BUCKET: knowledgeforge
      EXTRACTION_SUBSCRIPTION: knowledgeforge-extraction-worker
      LOCAL_EXTRACTION: "true"
      STORAGE_EMULATOR_HOST: http://fake-gcs:4443
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GEMINI_API_KEY: local-emulator-not-used
    command: ["python", "-m", "knowledgeforge.worker.extraction_pull_entrypoint"]
    healthcheck:
      disable: true

  outbox-dispatcher:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.worker
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://knowledgeforge:knowledgeforge@postgres:5432/knowledgeforge
      GCP_PROJECT_ID: local-project
      EXTRACTION_TOPIC: knowledgeforge-extraction
      LOCAL_EXTRACTION: "true"
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
    command:
      ["python", "-m", "knowledgeforge.extraction.outbox_dispatcher", "--loop"]
    healthcheck:
      disable: true

  smoke:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      API_BASE_URL: http://api:8000
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GCS_BASE_URL: http://fake-gcs:4443
    command: ["python", "scripts/emulator_smoke_test.py"]
